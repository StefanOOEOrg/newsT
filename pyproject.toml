[project]
name = "newstrading"
dynamic = ["version"]
description = "News and congressional trading signal monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.125,<1",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0.11,<7",
    "psycopg2-binary>=2.9.9,<3",
    "python-dotenv>=1.0,<2",
    "python-toon==0.2.0",
    "pytz>=2024.1",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.14",
]

[project.scripts]
newstrading = "newstrading.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in VERSION only; the wheel, the package metadata and the
# ``newstrading --version`` output all read it from there.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/newstrading"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["newstrading"]
