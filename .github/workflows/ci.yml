name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the package
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src
      - name: Format
        run: uv run ruff format --check src
      - name: Tests with coverage
        run: uv run pytest src/tests -q --cov=newstrading --cov-report=term --cov-fail-under=80

  ci-ok:
    needs: [package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        run: |
          echo "package: ${{ needs.package.result }}"
          [ "${{ needs.package.result }}" = "success" ]
